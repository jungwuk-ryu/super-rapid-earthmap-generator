[package]
name = "earthmap-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
earthmap-core = { path = "../earthmap-core" }
earthmap-gameplay = { path = "../earthmap-gameplay" }
earthmap-geo = { path = "../earthmap-geo" }
earthmap-minecraft = { path = "../earthmap-minecraft" }
earthmap-osm = { path = "../earthmap-osm" }
earthmap-parity = { path = "../earthmap-parity" }
earthmap-quality = { path = "../earthmap-quality" }
earthmap-region = { path = "../earthmap-region" }
earthmap-surface = { path = "../earthmap-surface" }
image.workspace = true
mimalloc = { workspace = true, optional = true }
png.workspace = true
rayon.workspace = true
serde_json.workspace = true

[features]
default = []
fast-allocator = ["dep:mimalloc"]

[dev-dependencies]
tempfile.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "earthmap-rs"
path = "src/main.rs"
