[workspace]
members = [
  "crates/earthmap-core",
  "crates/earthmap-geo",
  "crates/earthmap-surface",
  "crates/earthmap-minecraft",
  "crates/earthmap-region",
  "crates/earthmap-gameplay",
  "crates/earthmap-quality",
  "crates/earthmap-cli",
  "crates/earthmap-parity",
  "crates/earthmap-gui",
]
resolver = "2"

[workspace.package]
version = "0.0.0-phase0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
anyhow = "1"
arrayvec = "0.7"
assert_cmd = "2"
bytemuck = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
csv = "1"
eframe = "0.34.3"
flate2 = { version = "1", default-features = false, features = ["zlib-default"] }
geo = "0.30"
geo-types = "0.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
memmap2 = "0.9"
mimalloc = "0.1"
parking_lot = "0.12"
png = "0.17"
predicates = "3"
proptest = "1"
quick-xml = "0.40.1"
rayon = "1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
tempfile = "3"
thiserror = "2"
tiff = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2"
weezl = "0.2.1"
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = "thin"
