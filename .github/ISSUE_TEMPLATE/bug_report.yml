name: Bug report
description: Report a reproducible problem in the CLI, GUI, scripts, or generated output.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands or GUI settings. Do not attach proprietary rasters or generated full worlds.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Paste `earthmap-rs --version` output or a commit hash.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or evidence
      description: Redact private paths, secrets, and server addresses.
    validations:
      required: false
